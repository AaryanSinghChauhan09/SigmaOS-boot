name: Rust validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest:
    name: Manifest & README Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest and README
        run: |
          python3 - <<'PY'
          import pathlib, tomllib
          root = pathlib.Path(".")
          manifest = tomllib.loads((root / "Cargo.toml").read_text())
          assert manifest.get("package", {}).get("name"), "Cargo package name is missing"
          readme = manifest.get("package", {}).get("readme", "README.md")
          assert (root / readme).is_file(), f"README not found: {readme}"
          assert (root / "src" / "lib.rs").is_file(), "src/lib.rs is missing"
          PY

  build-test:
    name: Build & Test
    needs: manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: Build release
        run: cargo build --release
      - name: Run tests
        run: cargo test --all
